# Runs the checks on every pull request and on every change to main.
name: tests
on:
  pull_request:
  push:
    branches: [main]
# The job may only read the code, never change it.
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Install the check tools
        run: npm ci
      # No compiler here, but this catches a typo that would break the page.
      - name: Syntax check
        run: node --check calculator.js && node --check app.js
      - name: Lint
        run: npm run lint
      - name: Known security problems in the tools
        run: npm audit --audit-level=moderate
      - name: Tests
        run: npm test
